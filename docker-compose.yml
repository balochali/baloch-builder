services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: baloch
      POSTGRES_USER: baloch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baloch -d baloch"]
      interval: 5s
      retries: 20
  server:
    build: .
    environment:
      DATABASE_URL: postgres://baloch:${POSTGRES_PASSWORD}@postgres:5432/baloch
      NODE_ENV: production
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set a 64-character hex key}
      ATTACHMENT_DIR: /data/attachments
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run migrate -w @baloch/server && npm run start -w @baloch/server"
volumes:
  postgres_data:
  attachments:
