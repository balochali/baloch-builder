<!doctype html><html><head><meta charset="utf-8"><title>Baloch Builder</title><style>body{font:16px system-ui;background:#0d1726;color:#eef2f8;margin:60px;line-height:1.6}main{max-width:700px;margin:auto}button{padding:12px;border:0;border-radius:6px;background:#e9c467}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><h1>Baloch Builder</h1><p id="status">Opening your workspace. The first launch may take a few minutes…</p><pre id="details"></pre><button id="copy" hidden>Copy diagnostics</button></main><script>window.showFailure=function(info){document.getElementById('status').textContent=info.message;document.getElementById('details').textContent=JSON.stringify(info.diagnostics||{},null,2);const button=document.getElementById('copy');button.hidden=false;button.onclick=()=>navigator.clipboard.writeText(JSON.stringify(info,null,2));};</script></body></html>
